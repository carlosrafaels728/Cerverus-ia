name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: npm install

    - name: Prepare web assets folder
      run: |
        mkdir -p www
        cp -r index.html app.js styles.json manifest.json www/ 2>/dev/null || true
        cp *.js www/ 2>/dev/null || true
        cp *.html www/ 2>/dev/null || true
        cp *.css www/ 2>/dev/null || true

    - name: Initialize Android Platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Grant execute permission for gradlew
      run: cd android && chmod +x gradlew

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cerberus-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
