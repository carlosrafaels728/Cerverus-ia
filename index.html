<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerberus IA</title>
  <style>
    :root{
      --bg:#0d1117;
      --bg-2:#111827;
      --panel:#161b22;
      --panel-2:#1f2937;
      --panel-3:#0f172a;
      --line:#2b3747;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent:#8b5cf6;
      --accent-2:#22d3ee;
      --accent-3:#f472b6;
      --success:#34d399;
      --danger:#f87171;
      --shadow:0 10px 30px rgba(0,0,0,.25);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html, body{
      height:100%;
      background:
        radial-gradient(circle at top left, rgba(139,92,246,.18), transparent 30%),
        radial-gradient(circle at top right, rgba(34,211,238,.12), transparent 25%),
        var(--bg);
      color:var(--text);
      font-family:Segoe UI, system-ui, -apple-system, sans-serif;
      overflow:hidden;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .app{
      width:min(100%, 980px);
      height:100vh;
      max-height:100vh;
      display:flex;
      flex-direction:column;
      background:rgba(13,17,23,.72);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:var(--shadow);
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(17,24,39,.7);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      letter-spacing:.3px;
    }

    .brand-mark{
      width:34px;
      height:34px;
      border-radius:12px;
      background:linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      display:grid;
      place-items:center;
      font-weight:900;
      color:white;
      box-shadow:0 8px 18px rgba(139,92,246,.45);
    }

    .status{
      width:10px; height:10px; border-radius:50%;
      background:var(--success);
      box-shadow:0 0 0 6px rgba(52,211,153,.12);
      margin-left:auto;
    }

    .nav{
      display:flex;
      gap:8px;
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      overflow-x:auto;
      scrollbar-width:none;
    }

    .nav::-webkit-scrollbar{display:none;}

    .tab{
      border:none;
      background:rgba(255,255,255,.04);
      color:var(--muted);
      padding:9px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:600;
      transition:.2s ease;
      white-space:nowrap;
    }

    .tab.active{
      background:linear-gradient(135deg, rgba(139,92,246,.35), rgba(34,211,238,.18));
      color:white;
      border:1px solid rgba(255,255,255,.08);
    }

    .chat-shell{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .chat{
      flex:1;
      overflow-y:auto;
      padding:18px 18px 110px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .message{
      max-width:78%;
      width:fit-content;
      padding:12px 16px;
      border-radius:18px;
      line-height:1.6;
      word-break:break-word;
      font-size:15px;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
    }

    .message.user{
      align-self:flex-end;
      background:linear-gradient(135deg, var(--accent), #6d5efc);
      color:white;
      border-bottom-right-radius:6px;
    }

    .message.assistant{
      align-self:flex-start;
      background:rgba(255,255,255,.04);
      color:var(--text);
      border:1px solid rgba(255,255,255,.08);
      border-bottom-left-radius:6px;
    }

    .message.system{
      align-self:center;
      background:rgba(52,211,153,.08);
      border:1px solid rgba(52,211,153,.22);
      color:#b9f5d8;
      font-size:13px;
      padding:10px 12px;
      border-radius:12px;
    }

    .message.error{
      align-self:center;
      background:rgba(248,113,113,.08);
      border:1px solid rgba(248,113,113,.2);
      color:#fecaca;
      font-size:13px;
      padding:10px 12px;
      border-radius:12px;
    }

    .typing-box{
      align-self:flex-start;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      min-width:78px;
    }

    .typing-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:linear-gradient(135deg,#dfe7ff,#8b5cf6);
      animation:bounce 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2){animation-delay:.12s}
    .typing-dot:nth-child(3){animation-delay:.24s}

    @keyframes bounce{
      0%, 80%, 100% { transform:translateY(0) scale(.7); opacity:.4; }
      40% { transform:translateY(-4px) scale(1); opacity:1; }
    }

    .composer{
      position:absolute;
      left:0; right:0; bottom:0;
      padding:14px 18px 18px;
      background:linear-gradient(to top, rgba(13,17,23,.96), rgba(13,17,23,.55), transparent);
    }

    .composer-inner{
      display:flex;
      align-items:flex-end;
      gap:10px;
      background:rgba(17,24,39,.85);
      border:1px solid var(--line);
      border-radius:26px;
      padding:10px 12px;
      box-shadow:var(--shadow);
    }

    textarea{
      flex:1;
      resize:none;
      background:transparent;
      border:none;
      outline:none;
      color:var(--text);
      font-size:15px;
      line-height:1.5;
      max-height:140px;
      min-height:23px;
      padding:8px 10px;
    }

    textarea::placeholder{color:var(--muted);}

    .icon-btn, .send-btn{
      border:none;
      cursor:pointer;
      transition:.2s ease;
      display:grid;
      place-items:center;
    }

    .icon-btn{
      width:38px; height:38px;
      border-radius:50%;
      background:rgba(255,255,255,.04);
      color:var(--text);
    }

    .icon-btn:hover, .send-btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.08);
    }

    .send-btn{
      width:42px; height:42px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      color:white;
      box-shadow:0 8px 18px rgba(139,92,246,.45);
    }

    .settings{
      display:none;
      padding:22px 18px 18px;
      background:rgba(13,17,23,.82);
      height:100%;
      overflow-y:auto;
    }

    .settings.show{display:block;}

    .settings h2{
      font-size:22px;
      margin-bottom:18px;
      font-weight:700;
    }

    .field{
      margin-bottom:14px;
    }

    .field label{
      display:block;
      margin-bottom:8px;
      color:var(--muted);
      font-size:14px;
    }

    .field input, .field textarea, .field select{
      width:100%;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      color:var(--text);
      border-radius:12px;
      padding:11px 12px;
      outline:none;
    }

    .field input:focus, .field textarea:focus, .field select:focus{
      border-color:rgba(139,92,246,.8);
      box-shadow:0 0 0 3px rgba(139,92,246,.15);
    }

    .panel{
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin-bottom:18px;
    }

    .panel h3{
      margin-bottom:12px;
      font-size:16px;
      font-weight:700;
    }

    .primary-btn{
      border:none;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      color:white;
      border-radius:12px;
      padding:11px 16px;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }

    .ghost-btn{
      border:none;
      background:rgba(255,255,255,.04);
      color:var(--text);
      border-radius:12px;
      padding:11px 16px;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }

    .result-card{
      background:rgba(255,255,255,.02);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      margin-top:6px;
    }

    .result-card img, .result-card video{
      width:100%;
      border-radius:12px;
      display:block;
      margin-top:10px;
      max-height:420px;
      object-fit:cover;
    }

    .result-card a{
      color:#9bd6ff;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <span>Cerberus IA</span>
      </div>
      <span class="status"></span>
    </header>

    <nav class="nav">
      <button class="tab active" data-tab="chat">💬 Chat</button>
      <button class="tab" data-tab="images">🖼️ Imágenes</button>
      <button class="tab" data-tab="video">🎬 Video</button>
      <button class="tab" data-tab="scripts">📝 Guiones</button>
    </nav>

    <main class="chat-shell">
      <div id="chat" class="chat"></div>
    </main>

    <div class="composer">
      <div class="composer-inner">
        <button class="icon-btn" id="attachBtn" title="Adjuntar">📎</button>
        <textarea id="userInput" rows="1" placeholder="Escribe a Cerberus..."></textarea>
        <button class="send-btn" id="sendBtn" title="Enviar">➤</button>
      </div>
    </div>
  </div>

  <section id="settings" class="settings">
    <h2>⚙️ Configuración</h2>

    <div class="panel">
      <h3>🤖 Chat principal</h3>
      <div class="field">
        <label>URL de la API</label>
        <input id="apiUrl" type="text" placeholder="https://api.openai.com/v1/chat/completions">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Modelo</label>
        <input id="apiModel" type="text" placeholder="gpt-4o-mini">
      </div>
    </div>

    <div class="panel">
      <h3>🖼️ Generador de imágenes</h3>
      <div class="field">
        <label>URL</label>
        <input id="imageApiUrl" type="text" placeholder="https://openrouter.ai/api/v1/images/generations">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="imageApiKey" type="password" placeholder="sk-or-v1-...">
      </div>
      <div class="field">
        <label>Modelo</label>
        <input id="imageModel" type="text" placeholder="black-forest-labs/flux-1-schnell">
      </div>
    </div>

    <div class="panel">
      <h3>🎬 Generador de videos</h3>
      <div class="field">
        <label>URL</label>
        <input id="videoApiUrl" type="text" placeholder="https://openrouter.ai/api/v1/videos/generations">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="videoApiKey" type="password" placeholder="sk-or-v1-...">
      </div>
      <div class="field">
        <label>Modelo</label>
        <input id="videoModel" type="text" placeholder="kling-ai/kling-video-v1">
      </div>
    </div>

    <button class="primary-btn" id="saveSettingsBtn">Guardar configuración</button>
    <button class="ghost-btn" id="closeSettingsBtn">Volver al chat</button>
  </section>

  <script>
    const chatEl = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const tabs = [...document.querySelectorAll(".tab")];
    let currentTab = "chat";
    let typingTimer = null;
    let typingActive = false;

    function saveSettings() {
      localStorage.setItem("apiUrl", document.getElementById("apiUrl").value.trim());
      localStorage.setItem("apiKey", document.getElementById("apiKey").value.trim());
      localStorage.setItem("apiModel", document.getElementById("apiModel").value.trim());

      localStorage.setItem("imageApiUrl", document.getElementById("imageApiUrl").value.trim());
      localStorage.setItem("imageApiKey", document.getElementById("imageApiKey").value.trim());
      localStorage.setItem("imageModel", document.getElementById("imageModel").value.trim());

      localStorage.setItem("videoApiUrl", document.getElementById("videoApiUrl").value.trim());
      localStorage.setItem("videoApiKey", document.getElementById("videoApiKey").value.trim());
      localStorage.setItem("videoModel", document.getElementById("videoModel").value.trim());

      addMessage("✅ Configuración guardada correctamente.", "system");
    }

    function loadSettings() {
      document.getElementById("apiUrl").value = localStorage.getItem("apiUrl") || "";
      document.getElementById("apiKey").value = localStorage.getItem("apiKey") || "";
      document.getElementById("apiModel").value = localStorage.getItem("apiModel") || "";

      document.getElementById("imageApiUrl").value = localStorage.getItem("imageApiUrl") || "";
      document.getElementById("imageApiKey").value = localStorage.getItem("imageApiKey") || "";
      document.getElementById("imageModel").value = localStorage.getItem("imageModel") || "";

      document.getElementById("videoApiUrl").value = localStorage.getItem("videoApiUrl") || "";
      document.getElementById("videoApiKey").value = localStorage.getItem("videoApiKey") || "";
      document.getElementById("videoModel").value = localStorage.getItem("videoModel") || "";
    }

    function addMessage(text, role = "assistant") {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderHtmlMessage(html) {
      const div = document.createElement("div");
      div.className = "message assistant";
      div.innerHTML = html;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderTyping() {
      if (typingActive) return;
      typingActive = true;
      const wrap = document.createElement("div");
      wrap.className = "typing-box";
      wrap.id = "typing-box";
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dot.className = "typing-dot";
        wrap.appendChild(dot);
      }
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      if (!typingActive) return;
      typingActive = false;
      clearInterval(typingTimer);
      const existing = document.getElementById("typing-box");
      if (existing) existing.remove();
    }

    function openSettings() {
      document.querySelector(".app").style.display = "none";
      document.getElementById("settings").classList.add("show");
      loadSettings();
    }

    function closeSettings() {
      document.getElementById("settings").classList.remove("show");
      document.querySelector(".app").style.display = "flex";
    }

    function autoResizeTextarea() {
      const textarea = userInput;
      textarea.style.height = "auto";
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    userInput.addEventListener("input", autoResizeTextarea);

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      saveSettings();
      closeSettings();
    });

    document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);

    document.querySelector(".topbar").addEventListener("click", () => {
      openSettings();
    });

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentTab = tab.dataset.tab;
      });
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = "";
      autoResizeTextarea();

      addMessage(text, "user");

      if (currentTab === "images") {
        const url = localStorage.getItem("imageApiUrl");
        const key = localStorage.getItem("imageApiKey");
        const model = localStorage.getItem("imageModel");

        if (!url || !key || !model) {
          addMessage("⚠️ Completa la URL, la API key y el modelo de imagen en configuración.", "system");
          return;
        }

        renderTyping();
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`,
              "HTTP-Referer": "https://cerberus-ia.app",
              "X-Title": "Cerberus IA"
            },
            body: JSON.stringify({
              model,
              prompt: text
            })
          });

          hideTyping();

          const data = await res.json();

          if (!res.ok) {
            throw new Error(JSON.stringify(data, null, 2));
          }

          const imageUrl = data.data?.[0]?.url || data.url;
          if (imageUrl) {
            renderHtmlMessage(`
              <div class="result-card">
                <strong>✅ Imagen generada</strong>
                <img src="${imageUrl}" alt="Imagen generada" />
              </div>
            `);
          } else {
            addMessage("No se recibió ninguna imagen. Revisa modelo y API.", "system");
          }
        } catch (err) {
          hideTyping();
          addMessage("Error al generar imagen: " + err.message, "error");
        }
        return;
      }

      if (currentTab === "video") {
        const url = localStorage.getItem("videoApiUrl");
        const key = localStorage.getItem("videoApiKey");
        const model = localStorage.getItem("videoModel");

        if (!url || !key || !model) {
          addMessage("⚠️ Completa la URL, la API key y el modelo de video en configuración.", "system");
          return;
        }

        renderTyping();
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`,
              "HTTP-Referer": "https://cerberus-ia.app",
              "X-Title": "Cerberus IA"
            },
            body: JSON.stringify({
              model,
              prompt: text
            })
          });

          hideTyping();

          const data = await res.json();

          if (!res.ok) {
            throw new Error(JSON.stringify(data, null, 2));
          }

          const videoUrl = data.data?.[0]?.url || data.url || data.status_url;

          if (videoUrl) {
            renderHtmlMessage(`
              <div class="result-card">
                <strong>✅ Video solicitado</strong>
                <a href="${videoUrl}" target="_blank" rel="noopener noreferrer">Ver / descargar video</a>
              </div>
            `);
          } else {
            addMessage("✅ Solicitud enviada. Revisa la respuesta.", "system");
          }
        } catch (err) {
          hideTyping();
          addMessage("Error al generar video: " + err.message, "error");
        }
        return;
      }

      const url = localStorage.getItem("apiUrl");
      const key = localStorage.getItem("apiKey");
      const model = localStorage.getItem("apiModel");

      if (!url || !key || !model) {
        addMessage("⚠️ Configura la URL, la API key y el modelo del chat principal.", "system");
        return;
      }

      renderTyping();

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${key}`
          },
          body: JSON.stringify({
            model,
            messages: [
              { role: "system", content: "Eres Cerberus IA, un asistente inteligente, creativo y útil." },
              { role: "user", content: text }
            ],
            temperature: 0.8
          })
        });

        hideTyping();

        const data = await response.json();

        if (!response.ok) {
          throw new Error(JSON.stringify(data, null, 2));
        }

        const reply = data.choices?.[0]?.message?.content || data.content?.[0]?.text || "(sin respuesta)";
        addMessage(reply, "assistant");
      } catch (err) {
        hideTyping();
        addMessage("Error en el chat: " + err.message, "error");
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const welcome = document.createElement("div");
      welcome.className = "message assistant";
      welcome.textContent = "👋 Hola, soy Cerberus IA. Puedo ayudarte con chat, imágenes y videos.";
      chatEl.appendChild(welcome);
    });
  </script>
</body>
</html>
