<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Cerberus IA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand"><div class="logo">🐺</div><div><b>Cerberus IA</b><small>Asistente inteligente</small></div></div>
    <button id="theme">☾</button>
  </header>
  <main>
    <section class="hero">
      <div class="orb">◈</div>
      <h1>Hola, soy Cerberus IA</h1>
      <p>Base móvil preparada para crecer con chat, voz, imágenes, vídeo y automatización.</p>
    </section>
    <section id="messages" class="messages"></section>
    <div class="composer">
      <textarea id="input" placeholder="Escribe un mensaje..."></textarea>
      <div class="actions">
        <button id="mic">🎙️ Voz</button>
        <button id="attach">📎 Archivo</button>
        <button id="send" class="primary">Enviar</button>
      </div>
      <input id="file" type="file" hidden>
    </div>
  </main>
  <footer>Autor: CarlosArt · Cerberus IA</footer>
  <script src="app.js"></script>
</body>
</html>
