<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerberus IA</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="gemini-app">
        <!-- Barra superior móvil -->
        <header class="top-nav">
            <span class="app-title">Cerberus IA</span>
        </header>

        <!-- Contenedor principal del chat -->
        <main class="chat-container" id="chat-messages">
            <!-- Mensaje de bienvenida inicial -->
            <div class="welcome-section">
                <h1 class="gradient-text">Hola, Carlos.</h1>
                <p class="welcome-sub">¿En qué te puedo ayudar hoy?</p>
            </div>
        </main>

        <!-- Barra de entrada flotante inferior (Idéntica a Gemini) -->
        <div class="input-area">
            <div class="input-box">
                <button class="action-icon-btn" title="Adjuntar imagen o archivo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
                <textarea id="user-input" placeholder="Escribe un mensaje aquí..." rows="1"></textarea>
                <button class="action-icon-btn" title="Micrófono">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <button id="send-btn" class="send-btn" title="Enviar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <p class="disclaimer">Cerberus IA puede cometer errores, verifica la información importante.</p>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
